sources:
  - name: supplier_master
    type: csv
    path: supplier_master.csv

  - name: supplier_products
    type: csv
    path: supplier_products.csv

  - name: supplier_product_api
    type: api
    url: https://example.com/supplier_products

  - name: supplier_product_ftp
    type: ftp
    host: ftp.example.com
    port: 21
    username: supplier_user
    password_env_var: SUPPLIER_FTP_PASSWORD
    path: supplier_products.csv
    
validation:
  reject_invalid_rows: true