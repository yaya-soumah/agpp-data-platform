name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run pytest

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: agpp
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: agpp
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U agpp -d agpp"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      AGPP_ENV: testing
      POSTGRES_HOST: localhost
      POSTGRES_PORT: "5432"
      POSTGRES_DB: agpp
      POSTGRES_USER: agpp
      POSTGRES_PASSWORD: ci-only-password
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --locked
      - run: uv run pytest -m integration --no-cov
  image:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build --tag agpp-data-platform:ci .
      - name: The image starts
        run: docker run --rm agpp-data-platform:ci --version
      - name: The image runs as a non-root user
        run: test "$(docker run --rm --entrypoint id agpp-data-platform:ci -u)" = "10001"
      - name: The image contains no secrets or tests
        run: >-
          docker run --rm --entrypoint sh agpp-data-platform:ci
          -c 'test ! -e /app/.env && test ! -e /app/tests'
