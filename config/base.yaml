app:
  name: agpp-data-platform
  debug: false

database:
  host: ${POSTGRES_HOST:-localhost}
  port: ${POSTGRES_PORT:-5432}
  name: ${POSTGRES_DB}
  user: ${POSTGRES_USER}
  password: ${POSTGRES_PASSWORD}
  pool_min_size: 1
  pool_max_size: 5

logging:
  level: INFO
  format: console
  file: null
  file_max_bytes: 10485760
  file_backup_count: 5
