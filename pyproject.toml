[project]
name = "agpp-data-platform"
version = "1.0.0"
description = "A production-style data platform: three pipelines, one PostgreSQL warehouse, Airflow orchestration and data-quality checks."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "psycopg-pool>=3.2",
    "psycopg[binary]>=3.2",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
]

[project.urls]
Homepage = "https://github.com/yaya-soumah/agpp-data-platform"
Issues = "https://github.com/yaya-soumah/agpp-data-platform/issues"
Changelog = "https://github.com/yaya-soumah/agpp-data-platform/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.8",
    "mypy>=1.13",
    "pre-commit",
    "types-pyyaml>=6.0.12.20260906",
    "import-linter>=2.0",
]

[project.scripts]
agpp = "agpp.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/agpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config -m 'not integration' --cov=agpp --cov-report=term-missing --cov-fail-under=85 --ignore=orchestration/airflow"
markers = [
    "unit: fast, isolate tests (no network, no database)",
    "integration: needs external services (Postgres, FTP, ...)",
]

[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]
extend-exclude = ["orchestration"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "N", "C4", "RUF", "PT", "S"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]
"src/agpp/pipelines/*/sample_data.py" = ["S311"]

[tool.ruff.lint.pep8-naming]
ignore-names = ["do_GET"]

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
packages = ["agpp", "tests"]
plugins = ["pydantic.mypy"]
exclude = ["orchestration"]

[tool.coverage.run]
branch = true
source = ["agpp"]

[tool.coverage.report]
show_missing = true
exclude_also = [
    "if __name__ == .__main__.:",
]

[tool.importlinter]
root_package = "agpp"

[[tool.importlinter.contracts]]
name = "Layers: main, then pipelines, then shared code"
type = "layers"
layers = [
    "agpp.main",
    "agpp.pipelines",
    "agpp.shared",
]

[[tool.importlinter.contracts]]
name = "Pipelines are independent of each other"
type = "independence"
modules = [
    "agpp.pipelines.supplier_product",
    "agpp.pipelines.customer_orders",
    "agpp.pipelines.inventory",
]
