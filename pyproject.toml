[project]
name = "agpp-data-platform"
version = "0.1.0"
description = "Production-grade data engineering platform for global trade analytics."
requires-python = ">=3.12"

dependencies = [
    "polars-lts-cpu>=1.33.1",
    "pydantic",
    "pyyaml",
    "httpx",
]

[dependency-groups]
dev = [
    "mypy",
    "pytest",
    "ruff",
    "types-PyYAML",
    "email_validator",
    "tzdata",
    "pytest-asyncio",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--import-mode=importlib"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
]
ignore = [
    "E501",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
